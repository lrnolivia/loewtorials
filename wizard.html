<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>loewtorials</title>
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml" sizes="any">
<link rel="icon" href="favicon.png?v=2" type="image/png" sizes="32x32">
<link rel="shortcut icon" href="favicon.ico?v=2" sizes="16x16">
<link rel="mask-icon" href="safari-pinned-tab.svg?v=2" color="#ef4036">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@600;700;800&family=Space+Mono:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Playfair+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600&family=Work+Sans:wght@500;600&family=Inter:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/wizard.css">
<script src="assets/storage.js"></script>
<script src="assets/theme.js"></script>
<script src="assets/sync.js"></script>
<script>
// See index.html for why this runs this early — avoids a flash of
// default theme/layout before assets/settings.js takes over.
(function(){
  try{
    bootTheme();
    var raw = localStorage.getItem('loewtorials.settings.v1');
    var s = raw ? JSON.parse(raw) : {};
    if (s.textScale) document.documentElement.style.setProperty('--text-scale', String(s.textScale));
  }catch(e){}
})();
</script>
</head>
<body class="guide-page">

<div id="appHeaderMount"></div>

<div class="rail-backdrop" id="railBackdrop"></div>

<div class="shell-grid app" id="wizardRoot">
  <aside class="rail" id="rail" aria-label="Wizard map">
    <div id="railHeroMount"></div>
    <div class="rail-guide-info">
      <p class="rail-title">Current guide</p>
      <h1 class="rail-guide-title" id="railGuideTitle">Loading guide&hellip;</h1>
      <p class="rail-guide-subtitle" id="railGuideSubtitle"></p>
      <p class="rail-guide-description" id="railGuideDescription"></p>
    </div>
    <div class="rail-search">
      <input type="search" id="railSearchInput" placeholder="Search" aria-label="Search guides">
      <div class="rail-search-drop" id="railSearchDrop"></div>
    </div>
    <p class="rail-title rail-nav-title" id="railTitle">Guide steps</p>
    <div data-w="railContent"></div>
    <div class="rail-actions">
      <button class="btn btn-ghost btn-sm" id="openHelpDesktop">&#10022; Need help</button>
      <button class="btn btn-primary btn-sm" id="markSolvedBtn" style="display:none;">&#10003; Mark solved / finished</button>
    </div>
  </aside>

  <main class="stage">
    <div class="mobile-bar">
      <button class="map-btn" id="openRail">&#9776; Steps</button>
      <div class="progress"><span data-w="mobileProgress"></span></div>
      <button class="map-btn" id="openNotes">&#9998; Notes</button>
    </div>

    <div class="stage-top">
      <div class="guide-heading">
        <p class="eyebrow" data-w="phaseEyebrow">Phase</p>
        <h1 class="page-title" id="pageTitle">Loading guide&hellip;</h1>
        <p class="page-subtitle" id="pageSubtitle"></p>
        <p class="page-sub" id="pageSub"></p>
        <div class="view-toggle-row stage-view-toggle" id="viewToggleRow" style="display:none;">
          <p class="rail-title">Reading mode</p>
          <div class="view-toggle" id="viewToggle">
            <button type="button" data-view="wizard">&#9776; Guided</button>
            <button type="button" data-view="article">&para; Article</button>
          </div>
        </div>
      </div>
      <div class="util-row">
        <button class="icon-btn" id="editGuideBtn">&#9998; Edit info</button>
        <button class="icon-btn" id="openNotesDesktop">&#10022; Notes</button>
      </div>
    </div>

    <div id="confidenceBanner"></div>
    <div class="step-card load-state" data-w="stepCard">Loading&hellip;</div>

    <div class="reset-row"><button id="resetBtn" style="display:none">&#8635; Restart this guide</button></div>
  </main>
</div>

<button class="back-to-top" id="backToTop" type="button">&uarr; Back to top</button>
<div class="pull-refresh" id="pullRefresh" aria-hidden="true"><span>&#8635;</span> Pull to refresh</div>

<div class="notes-drawer" id="notesDrawer" role="dialog" aria-modal="false" aria-label="Notes" aria-hidden="true">
  <h3>Notes</h3>
  <p>Jot down anything worth remembering as you go. Nothing here is saved after you close the tab.</p>
  <textarea id="notesArea" placeholder="Notes..."></textarea>
  <button class="btn btn-back close-notes" id="closeNotes">&times; Close</button>
</div>

<div class="toast" id="toast"></div>

<script src="assets/settings.js"></script>
<script src="assets/profile.js"></script>
<script src="assets/completion.js"></script>
<script src="assets/header.js"></script>
<script src="assets/motion.js"></script>
<script src="assets/wizard-engine.js"></script>
<script src="assets/help.js"></script>
<script>
(async function () {
  await ensureSynced();
  bootAppearance();
  applyTheme(Storage.getThemePrefs()); // re-apply in case hydration pulled in a different theme from another device

  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const startStep = params.get('step');
  const stepCard = document.querySelector('[data-w="stepCard"]');

  window.showToast = function (msg, isError) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => { toast.className = 'toast'; }, 2600);
  };

  function showError(msg) {
    stepCard.className = 'step-card load-state error';
    stepCard.textContent = msg;
    document.getElementById('pageTitle').textContent = 'Guide not found';
    document.getElementById('pageSubtitle').textContent = '';
    document.getElementById('pageSub').textContent = '';
    document.getElementById('railGuideTitle').textContent = 'Guide not found';
    document.getElementById('railGuideSubtitle').textContent = '';
    document.getElementById('railGuideDescription').textContent = '';
  }

  if (!id) { showError('No wizard id given. Go back to the dashboard and pick a wizard.'); return; }

  let manifestWizards = [];
  fetch('wizards/manifest.json')
    .then(r => r.json())
    .then(manifest => {
      manifestWizards = manifest.wizards || [];
      return Storage.loadWizardData(id, manifestWizards);
    })
    .then(wizard => {
      if (!wizard || !wizard.steps || !wizard.start) throw new Error('This wizard\'s data looks incomplete (missing steps or a start step).');

      document.title = wizard.title + ' \u2014 loewtorials';
      document.getElementById('railTitle').textContent = modeLabelForKind(wizard.kind);
      document.getElementById('railGuideTitle').textContent = wizard.title;
      document.getElementById('railGuideSubtitle').textContent = wizard.subtitle || '';
      document.getElementById('railGuideDescription').textContent = wizard.description || '';
      document.getElementById('pageTitle').textContent = wizard.title;
      document.getElementById('pageSubtitle').textContent = wizard.subtitle || '';
      document.getElementById('pageSub').textContent = wizard.description || '';
      const compactTitle = document.getElementById('hdrGuideTitle');
      if (compactTitle) compactTitle.textContent = wizard.title;

      const refIndex = Storage.buildRefIndex(manifestWizards);
      const root = document.getElementById('wizardRoot');
      const profile = Storage.getProfile();

      // ---- which view: ?view= param (one-time) > saved per-wizard default > this wizard's own suggestion > 'article' ----
      const queryView = params.get('view');
      const savedDefault = (Storage.getOverrides()[id] || {}).defaultView || wizard.defaultView;
      let mode = (queryView === 'article' || queryView === 'wizard') ? queryView : (savedDefault || wizard.suggestedView || 'article');
      if (mode !== 'article' && mode !== 'wizard') mode = 'article';
      const savedDefaultRef = { value: savedDefault };

      function modeLabelForKind(kind) { return kind === 'article' ? 'Article sections' : 'Guide steps'; }

      const toggleRow = document.getElementById('viewToggleRow');
      const toggleEl = document.getElementById('viewToggle');
      const bannerEl = document.getElementById('confidenceBanner');
      const resetBtn = document.getElementById('resetBtn');
      const solvedBtn = document.getElementById('markSolvedBtn');
      toggleRow.style.display = '';

      let engine;

      function renderBanner() {
        const showBanner = wizard.confidence === 'low' && mode === 'wizard';
        if (!showBanner) { bannerEl.innerHTML = ''; return; }
        const notes = (wizard.confidenceNotes || []).slice(0, 4);
        bannerEl.innerHTML = `<div class="confidence-banner">
          <span class="icon">&#9888;</span>
          <div>
            <h4>This wizard was auto-converted from a plain document</h4>
            ${notes.length ? '<ul>' + notes.map(n => `<li>${escapeHtmlLocal(n)}</li>`).join('') + '</ul>' : '<p style="margin:4px 0 10px; font-size:0.8125rem; color:var(--tx-muted);">The step structure may not be quite right.</p>'}
            <div class="actions">
              <button type="button" class="btn btn-sm btn-primary" id="bannerSwitchBtn">Switch to Article view</button>
            </div>
          </div>
        </div>`;
        const btn = document.getElementById('bannerSwitchBtn');
        if (btn) btn.addEventListener('click', () => setMode('article'));
      }

      function escapeHtmlLocal(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

      function updateToggleUi() {
        toggleEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.getAttribute('data-view') === mode));
      }

      function setMode(newMode) {
        mode = newMode;
        root.dataset.viewMode = mode;
        const url = new URL(location.href);
        url.searchParams.set('view', mode);
        history.replaceState(null, '', url);
        renderBanner();
        updateToggleUi();
        mountEngine();
      }

      function mountEngine() {
        root.dataset.viewMode = mode;
        const paint = () => {
          resetBtn.style.display = mode === 'wizard' ? '' : 'none';
          if (mode === 'article') {
            engine = renderArticleView(root, wizard, { profile });
            engine.render();
          } else {
            engine = createWizardEngine(root, wizard, {
              startAt: startStep,
              currentWizardId: id,
              resolveRef: filename => Storage.resolveRef(refIndex, filename),
              loadWizard: wizardId => Storage.loadWizardData(wizardId, manifestWizards),
              profile
            });
            engine.render();
          }
          if (window.Motion) Motion.updatePageSnap();
        };
        paint();
      }

      toggleEl.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => { if (b.getAttribute('data-view') !== mode) setMode(b.getAttribute('data-view')); });
      });
      function openEditInfo() {
        const existing = document.getElementById('guide-edit-backdrop');
        if (existing) existing.remove();
        const meta = Object.assign({}, wizard, Storage.getOverrides()[id] || {});
        const reports = Storage.getCompletionsFor(id);
        const latestReport = reports.length ? reports[reports.length - 1] : null;
        const wrap = document.createElement('div');
        wrap.innerHTML = `<div class="modal-backdrop" id="guide-edit-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="guide-edit-title-label">
          <button class="modal-close" type="button" aria-label="Close">&times;</button>
          <h2 id="guide-edit-title-label">Edit info</h2><p class="hint">Update how this guide appears. Content and steps are unchanged.</p>
          <div class="field"><label for="guide-edit-title">Title</label><input type="text" id="guide-edit-title"></div>
          <div class="field"><label for="guide-edit-category">Category</label><input type="text" id="guide-edit-category"></div>
          <div class="field"><label for="guide-edit-tags">Tags</label><input type="text" id="guide-edit-tags"></div>
          <div class="field"><label id="guide-edit-default-label">Default reading mode</label><div class="view-toggle edit-default-view-toggle" id="guide-edit-default" role="group" aria-labelledby="guide-edit-default-label"><button type="button" data-default-view="wizard">&#9776; Guided</button><button type="button" data-default-view="article">&para; Article</button></div><p class="field-help">Choose which reading mode opens first for this guide.</p></div>
          ${latestReport ? '<div class="field"><label>Latest saved report</label><div class="spec-actions"><button class="btn btn-ghost btn-sm" id="guide-report-copy" type="button">&#10697; Copy summary</button><button class="btn btn-ghost btn-sm" id="guide-report-download" type="button">&darr; Download .md</button></div></div>' : ''}
          <div class="spec-actions"><button class="btn btn-ghost" data-close type="button">&times; Cancel</button><button class="btn btn-primary" id="guide-edit-save" type="button">&#10003; Save</button></div>
        </div></div>`;
        document.body.appendChild(wrap.firstElementChild);
        const backdrop = document.getElementById('guide-edit-backdrop');
        document.getElementById('guide-edit-title').value = meta.title || '';
        document.getElementById('guide-edit-category').value = meta.category || '';
        document.getElementById('guide-edit-tags').value = (meta.tags || []).join(', ');
        let editDefaultView = savedDefaultRef.value || wizard.defaultView || 'wizard';
        const defaultViewToggle = document.getElementById('guide-edit-default');
        const paintDefaultView = () => defaultViewToggle.querySelectorAll('button').forEach(button => {
          const active = button.dataset.defaultView === editDefaultView;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });
        defaultViewToggle.querySelectorAll('button').forEach(button => button.onclick = () => {
          editDefaultView = button.dataset.defaultView;
          paintDefaultView();
        });
        paintDefaultView();
        if (latestReport) {
          document.getElementById('guide-report-copy').onclick = () => navigator.clipboard.writeText(latestReport.generatedMd || generateCompletionMd(wizard.title, latestReport)).then(() => showToast('Summary copied.'));
          document.getElementById('guide-report-download').onclick = () => Storage.downloadText(id + '-report-' + latestReport.date + '.md', latestReport.generatedMd || generateCompletionMd(wizard.title, latestReport));
        }
        const close = () => backdrop.remove();
        backdrop.querySelector('.modal-close').onclick = close;
        backdrop.querySelector('[data-close]').onclick = close;
        backdrop.onclick = e => { if (e.target === backdrop) close(); };
        document.getElementById('guide-edit-save').onclick = () => {
          const title = document.getElementById('guide-edit-title').value.trim();
          if (!title) return showToast('Title cannot be empty.', true);
          const patch = {
            title,
            category: document.getElementById('guide-edit-category').value.trim() || 'Uncategorized',
            tags: document.getElementById('guide-edit-tags').value.split(',').map(t => t.trim()).filter(Boolean)
          };
          patch.defaultView = editDefaultView;
          Storage.setOverride(id, patch);
          savedDefaultRef.value = patch.defaultView || null;
          document.getElementById('railGuideTitle').textContent = title;
          document.getElementById('pageTitle').textContent = title;
          const compactTitle = document.getElementById('hdrGuideTitle');
          if (compactTitle) compactTitle.textContent = title;
          close(); showToast('Guide info saved.');
        };
      }
      document.getElementById('editGuideBtn').addEventListener('click', openEditInfo);

      renderBanner();
      updateToggleUi();
      mountEngine();

      resetBtn.addEventListener('click', () => { if (engine.resetAll) engine.resetAll(); });

      solvedBtn.style.display = '';
      solvedBtn.addEventListener('click', () => {
        initCompletionModal({
          id,
          title: wizard.title,
          steps: wizard.steps,
          getHistory: () => engine.history ? engine.history.concat([engine.currentId]) : (engine.getHistory ? engine.getHistory() : []),
          getChecked: () => engine.getChecked()
        });
      });
      window.onCompletionSaved = () => { solvedBtn.textContent = '\u2713 Solved \u2014 mark again'; };

      document.getElementById('openHelpDesktop').addEventListener('click', () => {
        GuideHelp.open({
          id,
          wizard,
          getMode: () => mode,
          getCurrentStepId: () => mode === 'wizard' && engine ? engine.currentId : '',
          showToast
        });
      });
    })
    .catch(err => {
      console.error(err);
      showError(err.message || 'Could not load this wizard.');
    });

  // chrome: mobile rail + notes drawer
  const rail = document.getElementById('rail');
  const backdrop = document.getElementById('railBackdrop');
  document.getElementById('openRail').addEventListener('click', () => { rail.classList.add('open'); backdrop.classList.add('open'); });
  backdrop.addEventListener('click', () => { rail.classList.remove('open'); backdrop.classList.remove('open'); });

  const notes = document.getElementById('notesDrawer');
  const openNotesDrawer = () => {
    notes.classList.add('open');
    notes.setAttribute('aria-hidden', 'false');
    setTimeout(() => document.getElementById('notesArea').focus(), 0);
  };
  const closeNotesDrawer = () => {
    notes.classList.remove('open');
    notes.setAttribute('aria-hidden', 'true');
  };
  document.getElementById('openNotes').addEventListener('click', openNotesDrawer);
  document.getElementById('openNotesDesktop').addEventListener('click', openNotesDrawer);
  document.getElementById('closeNotes').addEventListener('click', closeNotesDrawer);
})();
</script>
</body>
</html>
